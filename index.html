<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自己紹介 | 山田花子</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      background-color: #f3f6fb;
      color: #333;
      font-family: sans-serif;
    }

    .profile {
      max-width: 600px;
      margin: 0 auto;
      padding: 32px;
      background-color: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .profile img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
    }

    h1 {
      margin-bottom: 8px;
      color: #2b5d8a;
    }

    .intro {
      line-height: 1.8;
    }

    .hobbies {
      margin-top: 24px;
      padding: 16px;
      background-color: #f3f6fb;
      border-radius: 10px;
      text-align: left;
    }

    a {
      color: #2b5d8a;
    }
  </style>
</head>
<body>
  <main class="profile">
    <img src="https://placehold.co/240x240" alt="プロフィール画像">

    <h1>山田 花子</h1>
    <p>こんにちは！Web制作を勉強中です。</p>

    <p class="intro">
      新しいことを学ぶのが好きです。<br>
      少しずつ作品を作りながら、HTMLとCSSを練習しています。
    </p>

    <section class="hobbies">
      <h2>好きなこと</h2>
      <ul>
        <li>読書</li>
        <li>カフェ巡り</li>
        <li>写真を撮ること</li>
        <li>筋トレ</li>
      </ul>
    </section>

    <p>
      <a href="https://example.com">プロフィールはこちら</a>
    </p>
  </main>
</body>
</html>
